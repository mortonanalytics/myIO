on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: e2e

permissions: read-all

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Build the production bundle: the webgl-scatter-1M spec loads
      # inst/htmlwidgets/myIO/myIOapi.js, so the e2e suite guards the minified
      # bundle that vitest (which imports src/) cannot.
      - name: Build htmlwidget bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
