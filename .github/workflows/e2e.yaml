on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: e2e

permissions: read-all

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Build the production bundle: the webgl-scatter-1M spec loads
      # inst/htmlwidgets/myIO/myIOapi.js, so the e2e suite guards the minified
      # bundle that vitest (which imports src/) cannot.
      - name: Build htmlwidget bundle
        run: npm run build

      - name: Verify the committed htmlwidget bundle
        run: git diff --exit-code -- inst/htmlwidgets/myIO/myIOapi.js

      # shiny-server-engine.spec.ts runs a live Shiny app against the package
      # source, so the suite needs R with the server-engine packages.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::shiny
            any::arrow
            any::base64enc
            any::duckdb
            any::DBI
            any::later

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
