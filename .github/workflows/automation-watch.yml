name: automation-watch

# The backlog-pipeline intake gate refuses new work while an automation-pr is open, so an
# unreviewed automation PR does not just wait — it idles the whole loop. #120 sat open for
# five days at 11/11 green, went CONFLICTING at 14 commits behind, and every scheduled run
# behind it would have no-oped. Nothing said so, because the loops write to log files on a
# laptop. This comments once per PR, on the PR, where a notification already reaches the
# maintainer.
#
# The second job covers the opposite failure: no automation PR at all. The 2026-10-05
# run committed #149 and exited before pushing, and the 10-12 and 10-19 runs never
# started a session; the stale-PR job saw nothing open and stayed green for three
# weeks. Ported from ione's loop-liveness.yml.

on:
  schedule:
    - cron: '0 15 * * *' # 09:00 America/Denver (MDT)
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Override the age threshold for a manual run"
        required: false
        default: "48"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  stale-automation-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Comment once on automation PRs past the age threshold
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '48' }}
        run: |
          set -euo pipefail

          # Stable marker so a PR is commented on at most once, ever. Changing it would
          # re-notify every currently open automation PR.
          MARKER='<!-- automation-watch:stale-automation-pr -->'
          NOW=$(date -u +%s)

          gh pr list --label automation-pr --state open \
            --json number,title,createdAt,mergeable,mergeStateStatus,statusCheckRollup \
            > prs.json

          COUNT=$(jq 'length' prs.json)
          echo "Open automation-pr count: ${COUNT}"
          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing open. The pipeline's intake gate is clear."
            exit 0
          fi

          jq -c '.[]' prs.json | while read -r pr; do
            NUM=$(printf '%s' "$pr" | jq -r '.number')
            TITLE=$(printf '%s' "$pr" | jq -r '.title')
            CREATED=$(printf '%s' "$pr" | jq -r '.createdAt')
            MERGEABLE=$(printf '%s' "$pr" | jq -r '.mergeable')
            MERGESTATE=$(printf '%s' "$pr" | jq -r '.mergeStateStatus')

            CREATED_S=$(date -u -d "$CREATED" +%s)
            AGE_H=$(( (NOW - CREATED_S) / 3600 ))
            if [ "$AGE_H" -lt "$MAX_AGE_HOURS" ]; then
              echo "#${NUM}: ${AGE_H}h old, under the ${MAX_AGE_HOURS}h threshold. Skipping."
              continue
            fi

            # Capture, then match in-process. Piping gh into `grep -q` under
            # `set -o pipefail` is wrong: grep exits at the first match, gh dies on
            # SIGPIPE, and pipefail reports 141 for a pipeline that did match — so the
            # guard reads "not commented" and re-notifies daily. It only trips once the
            # output exceeds the pipe buffer, which is to say on the PRs with the most
            # comments: exactly the long-open ones this job targets.
            COMMENTS="$(gh pr view "$NUM" --json comments --jq '.comments[].body')"
            if [[ "$COMMENTS" == *"$MARKER"* ]]; then
              echo "#${NUM}: already commented. Skipping."
              continue
            fi

            # Roll the checks up by conclusion so the comment is actionable without
            # opening the PR.
            # A rollup entry is either a CheckRun (.conclusion) or a StatusContext
            # (.state), and an in-progress CheckRun carries conclusion "" — an empty
            # string, which is truthy in jq, so `//` never reaches a fallback. Test the
            # emptiness explicitly or pending checks render as a blank label.
            CHECKS=$(printf '%s' "$pr" | jq -r '
              (.statusCheckRollup // [])
              | map(
                  (.conclusion // "") as $c | (.state // "") as $s
                  | if $c != "" then $c elif $s != "" then $s else "PENDING" end
                )
              | group_by(.) | map("\(length) \(.[0])") | join(", ")
              | if . == "" then "no checks reported" else . end')

            {
              printf '%s\n\n' "$MARKER"
              printf 'This automation PR has been open for **%s hours** and is blocking `/backlog-pipeline`, whose intake gate refuses new work while any `automation-pr` is open.\n\n' "$AGE_H"
              printf '| | |\n| --- | --- |\n'
              printf '| Checks | %s |\n' "$CHECKS"
              printf '| Mergeable | `%s` / `%s` |\n\n' "$MERGEABLE" "$MERGESTATE"
              printf 'Merging or closing it releases the queue. The pipeline will rebase it if it goes stale, but it will never merge or close it — that call is yours.\n\n'
              printf '_Posted once by `automation-watch.yml`. This PR will not be commented on again._\n'
            } > body.md

            gh pr comment "$NUM" --body-file body.md
            echo "#${NUM}: commented (${AGE_H}h old, ${TITLE})."
          done

  stalled-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STALL_TITLE: "Automation loop has not merged in 7 days"

    steps:
      - name: Open or update an issue when ready work exists and nothing merged
        uses: actions/github-script@v9
        with:
          script: |
            const title = process.env.STALL_TITLE;
            const weekAgo = new Date(Date.now() - 7 * 24 * 3600 * 1000);

            const ready = (await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', labels: 'backlog-ready', per_page: 100 }
            )).filter(item => !item.pull_request);

            if (ready.length === 0) {
              core.info('no backlog-ready work; an idle loop is correct');
              return;
            }

            const merged = (await github.paginate(
              github.rest.pulls.list,
              { ...context.repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 50 }
            )).filter(pr => pr.merged_at && new Date(pr.merged_at) > weekAgo
                            && pr.user.login !== 'dependabot[bot]');

            if (merged.length > 0) {
              core.info(`${merged.length} non-dependabot PR(s) merged in the last 7 days; loop is alive`);
              return;
            }

            const existing = (await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', per_page: 100 }
            )).find(item => !item.pull_request && item.title === title);

            // Daily schedule: comment at most once a week on an existing issue.
            if (existing && new Date(existing.updated_at) > weekAgo) {
              core.warning(`loop still stalled; #${existing.number} updated within 7 days`);
              return;
            }

            const oldest = ready[ready.length - 1];
            const body = [
              `${ready.length} issue(s) carry \`backlog-ready\` and no non-dependabot pull request has merged since ${weekAgo.toISOString().slice(0, 10)}.`,
              '',
              `Oldest ready: #${oldest.number} — ${oldest.title}`,
              '',
              'The loop runs from launchd on the maintainer\'s laptop. Check, in this order:',
              '- `~/.local/share/myio-automation-ledger.tsv` for harness-fail rows',
              '- `~/.local/share/myio-backlog-pipeline.stderr.log`',
              '- local `auto/*` branches that were committed but never pushed',
              '- `main` CI is not red',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
              core.warning(`loop still stalled; commented on #${existing.number}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              ...context.repo, title, body,
            });
            core.warning(`loop stalled; opened #${issue.number}`);
