url: https://mortonanalytics.github.io/myIO/

development:
  mode: auto

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#6A5ACD"
    font_scale: 1.05
    base_font:
      google: Inter
    heading_font:
      google: Inter
    code_font:
      google: Fira Code

home:
  title: myIO - Interactive D3.js Visualizations from R
  links:
    - text: Live demo (Shiny app)
      href: https://www.morton-analytics.com/myio/
    - text: D3.js documentation
      href: https://d3js.org/
    - text: htmlwidgets framework
      href: https://www.htmlwidgets.org/

authors:
  Ryan Morton:
    href: https://github.com/mortonanalytics

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    github:
      icon: fa-github
      href: https://github.com/mortonanalytics/myIO

articles:
  - title: Getting Started
    contents:
      - articles/getting-started
      - chart-types
      - transforms-and-theming
      - why-myio
  - title: Shiny & Interactions
    contents:
      - shiny-integration
      - articles/shiny-interactions
  - title: Big-data & Linking
    contents:
      - large-data-linking
      - articles/crosstalk-linking
      - sparklines
  - title: Migration
    contents:
      - plotly-migration
  - title: LLM & Agents
    contents:
      - llm-tool-calling
  - title: Gallery
    contents:
      - articles/gallery
      - articles/theme-gallery
  - title: Help
    contents:
      - articles/troubleshooting

reference:
  - title: Core
    desc: Create widgets and add visualization layers
    contents:
      - myIO
      - addIoLayer
  - title: Axes & Scales
    desc: Control axis formatting, limits, and orientation
    contents:
      - setAxisFormat
      - setAxisLimits
      - defineCategoricalAxis
      - flipAxis
      - suppressAxis
  - title: Appearance
    desc: Customize colors, margins, themes, and visual elements
    contents:
      - setMargin
      - setColorScheme
      - setTheme
      - setTitle
      - setTransition
      - setTransitionSpeed
      - suppressLegend
  - title: Interactions
    desc: Add interactive behaviors like brushing, annotation, and linked views
    contents:
      - setBrush
      - setAnnotation
      - setLinked
      - setLinkedCursor
      - setSlider
      - dragPoints
      - setReferenceLines
      - setToggle
      - setToolTipOptions
      - linkCharts
  - title: Layout & Composition
    desc: Multi-panel composition, opacity, and export configuration
    contents:
      - setFacet
      - setLayerOpacity
      - setExportOptions
  - title: Big-data
    desc: Large-dataset virtualization, WebGL rendering, and DuckDB-WASM cache
    contents:
      - setBigData
      - install_duckdb_wasm
      - duckdb_wasm_status
      - clear_duckdb_wasm_cache
  - title: Shiny
    desc: Use myIO widgets in Shiny applications
    contents:
      - starts_with("myIO-shiny")
  - title: LLM Tool Calling
    desc: Machine-readable schema and validators for agent-built chart specs
    contents:
      - myio_list_chart_types
      - myio_chart_schema
      - myio_validate_spec
      - myio_list_functions
      - myio_function_signature
      - myio_validate_call
  - title: Diagnostics
    desc: Debugging and error reporting
    contents:
      - myIO_last_error
