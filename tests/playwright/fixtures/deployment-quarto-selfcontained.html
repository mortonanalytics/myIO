<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline';">
</head>
<body>
  <div id="chart"></div>
  <script>
    window.myIO = window.myIO || {};
    window.myIO.bootCoordinator = function(config) {
      window.__coordinatorBooted = true;
      window.__resolvedEngine = config.engine;
      return { register: function() {}, unregister: function() {} };
    };

    document.addEventListener("DOMContentLoaded", function() {
      window.myIO.bootCoordinator({
        specVersion: 2,
        coordinator_enabled: true,
        engine: "svg"
      });
      window.__myioTestReady = true;
    });
  </script>
</body>
</html>
