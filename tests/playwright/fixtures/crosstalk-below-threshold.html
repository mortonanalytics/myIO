<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <div class="myio-footer"></div>
  <script type="module">
    import { CrosstalkAdapter } from "../../../inst/htmlwidgets/myIO/src/crosstalk-adapter/index.js";

    let mockCount = 0;
    window.__siblingLastKeys = null;

    function SelectionHandle() {}
    SelectionHandle.prototype.on = function() {};
    SelectionHandle.prototype.set = function(keys) {
      window.__siblingLastKeys = keys;
    };
    SelectionHandle.prototype.close = function() {};
    window.crosstalk = { SelectionHandle };

    const fakeAdapter = {
      query: async function*({ sql, queryId }) {
        let rows = [];
        if (sql.startsWith("SELECT count(*) AS n")) {
          rows = [{ n: mockCount }];
        } else if (sql.startsWith("SELECT \"__myio_rowkey__\" AS rowkey")) {
          rows = Array.from({ length: mockCount }, (_, i) => ({
            rowkey: "k" + (i + 1)
          }));
        }
        yield { rows, queryId };
        yield { __trailer: true, queryId, rowCount: rows.length, elapsedMs: 1 };
      }
    };

    const coordinator = {
      adapters: new Map([["s1", fakeAdapter]]),
      setSelection() {},
      subscribers: new Map()
    };

    const xAdapter = new CrosstalkAdapter({
      coordinator,
      sourceId: "s1",
      threshold: 100
    });
    xAdapter.attach("g1");
    xAdapter.setBadge(document.querySelector(".myio-footer"));

    window.__brush = async (predicate, rowCount) => {
      mockCount = rowCount;
      await xAdapter.broadcast({ predicate });
    };

    window.__myioTestReady = true;
  </script>
</body>
</html>
