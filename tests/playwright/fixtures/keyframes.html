<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="/inst/htmlwidgets/lib/d3.min.js"></script>
  <script src="/inst/htmlwidgets/myIO/myIOapi.js"></script>
  <link rel="stylesheet" href="/inst/htmlwidgets/myIO/style.css">
</head>
<body>
  <div id="chart"></div>
  <script>
    function layer(data) {
      return {
        id: "layer_001", type: "point", label: "series", data: data,
        mapping: { x_var: "x", y_var: "y" }, options: { barSize: "large" },
        transform: "identity", transformMeta: {}, encoding: {},
        sourceKey: "_source_key", derivedFrom: null, order: 1,
        visibility: true, color: "#4E79A7"
      };
    }
    var frames = [
      { label: "Start", layers: [{ label: "series", data: [{ x: 1, y: 10 }, { x: 2, y: 20 }] }] },
      { label: "Middle", layers: [{ label: "series", data: [{ x: 1, y: 40 }, { x: 2, y: 50 }, { x: 3, y: 60 }] }] },
      { label: "End", layers: [{ label: "series", data: [{ x: 1, y: 70 }, { x: 2, y: 80 }, { x: 3, y: 90 }, { x: 4, y: 95 }] }] }
    ];
    window.__mountKeyframes = function() {
      d3.select("#chart").selectAll("*").remove();
      window.__chart = new myIOchart({
        element: document.getElementById("chart"),
        width: 600,
        height: 400,
        config: {
          specVersion: 2,
          layers: [layer([{ x: 0, y: 0 }])],
          keyframes: frames,
          layout: { margin: { top: 30, bottom: 60, left: 50, right: 5 }, suppressLegend: false, suppressAxis: { xAxis: false, yAxis: false } },
          scales: { xlim: { min: 0, max: 5 }, ylim: { min: 0, max: 100 }, categoricalScale: { xAxis: false, yAxis: false }, flipAxis: false, colorScheme: { colors: ["#4E79A7"], domain: ["none"], enabled: false } },
          axes: { xAxisFormat: "s", yAxisFormat: "s", xAxisLabel: null, yAxisLabel: null, toolTipFormat: "s" },
          interactions: { dragPoints: false, toggleY: { variable: null, format: null }, toolTipOptions: { suppressY: false } },
          theme: {}, transitions: { speed: 0 }, referenceLines: { x: null, y: null }
        }
      });
    };
    window.__myioTestReady = true;
  </script>
</body>
</html>
