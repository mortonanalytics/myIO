<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="../../../inst/htmlwidgets/myIO/myIOapi.js"></script>
  <style>
    html, body, #plot { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #plot { position: relative; width: 800px; height: 600px; }
  </style>
</head>
<body>
  <div id="plot"></div>
  <script type="module">
    let seed = 123456789;
    const rand = () => {
      seed = (1664525 * seed + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const points = new Array(1000000);
    points[0] = { x: 0.5, y: 0.5, category: 0, value: 1 };
    for (let i = 1; i < points.length; i++) {
      points[i] = { x: rand(), y: rand(), category: i % 6, value: 1 };
    }
    const scale = { domain: () => [0, 1], range: () => [0, 1] };
    const scatter = window.myIO.webglRenderers.createWebGLRenderer({
      kind: "scatter",
      el: document.getElementById("plot"),
      width: 800,
      height: 600,
      xScale: scale,
      yScale: scale
    });
    await scatter.update(points);
    await new Promise((resolve) => requestAnimationFrame(resolve));
    window.__myioTestReady = true;
  </script>
</body>
</html>
