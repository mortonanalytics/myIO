<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self';">
</head>
<body>
  <div id="chart"></div>
  <script type="module">
    window.__resolvedEngine = "svg";
    await import("../../../inst/htmlwidgets/myIO/src/index.js");

    if (!window.myIO || typeof window.myIO.bootCoordinator !== "function") {
      throw new Error("myIO coordinator surface did not load");
    }

    window.myIO.bootCoordinator({
      specVersion: 2,
      coordinator_enabled: true,
      engine: window.__resolvedEngine
    });
    window.__myioTestReady = true;
  </script>
</body>
</html>
